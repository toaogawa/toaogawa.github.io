              - { label: "カテゴリ", name: "category", widget: "string", default: "music", hint: "通常はmusicのままでOKです" }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "ひとこと説明(一覧用)", name: "desc", widget: "string" }
              - { label: "YouTube ID", name: "youtubeId", widget: "string", required: false }
              - { label: "日付", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "サムネイル画像のパス", name: "thumbnail", widget: "string", required: false }
              - label: "本文(詳細ページに表示)"
                name: "detail"
                widget: "markdown"
                required: false
                modes: ["rich_text"]
                buttons: ["bold", "heading-two", "heading-three", "link"]
                editor_components: ["single-image", "image", "large-text", "small-text", "pink-text"]

  # ===== WORKS - DESIGN =====
  - name: "works-design"
    label: "Works / Design"
    files:
      - name: "works_design_list"
        label: "Design一覧"
        file: "data/works-design.json"
        fields:
          - label: "項目"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "ID(既存のものは変更しないでください)", name: "id", widget: "string" }
              - { label: "カテゴリ", name: "category", widget: "string", default: "design", hint: "通常はdesignのままでOKです" }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "ひとこと説明(一覧用)", name: "desc", widget: "string" }
              - { label: "YouTube ID", name: "youtubeId", widget: "string", required: false }
              - { label: "日付", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "サムネイル画像のパス", name: "thumbnail", widget: "string", required: false }
              - label: "本文(詳細ページに表示)"
                name: "detail"
                widget: "markdown"
                required: false
                modes: ["rich_text"]
                buttons: ["bold", "heading-two", "heading-three", "link"]
                editor_components: ["single-image", "image", "large-text", "small-text", "pink-text"]

  # ===== WORKS - OTHERS =====
  - name: "works-others"
    label: "Works / Others"
    files:
      - name: "works_others_list"
        label: "Others一覧"
        file: "data/works-others.json"
        fields:
          - label: "項目"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "ID(既存のものは変更しないでください)", name: "id", widget: "string" }
              - { label: "カテゴリ", name: "category", widget: "string", default: "others", hint: "通常はothersのままでOKです" }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "ひとこと説明(一覧用)", name: "desc", widget: "string" }
              - { label: "YouTube ID", name: "youtubeId", widget: "string", required: false }
              - { label: "日付", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "サムネイル画像のパス", name: "thumbnail", widget: "string", required: false }
              - label: "本文(詳細ページに表示)"
                name: "detail"
                widget: "markdown"
                required: false
                modes: ["rich_text"]
                buttons: ["bold", "heading-two", "heading-three", "link"]
                editor_components: ["single-image", "image", "large-text", "small-text", "pink-text"]

  # ===== BLOG =====
  - name: "blog"
    label: "Blog"
    files:
      - name: "blog_list"
        label: "ブログ一覧"
        file: "data/blog.json"
        fields:
          - label: "記事"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "ID(既存のものは変更しないでください)", name: "id", widget: "string", hint: "他のページへのリンク用の固有IDです。新しい記事には new-post-01 のような未使用の値を付けてください" }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "ひとこと説明(一覧用)", name: "excerpt", widget: "string" }

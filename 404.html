<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尾川翔彩のウェブサイト</title>
<!--
  GitHub Pagesでは /mv/xxx のようなURLに対応するファイルがないため、このページが表示されます。
  ここでは最新の index.html を読み込んで、そのまま表示します(URLは変えないので、script.js がそのページを開きます)。
  index.html を修正しても、このファイルは直さなくてOKです。
-->
<style>body{margin:0;background:#f6f7f9;}</style>
</head>
<body>
<script>
  fetch('/index.html', { cache: 'no-cache' })
    .then(function(res){ if(!res.ok) throw new Error(res.status); return res.text(); })
    .then(function(html){
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(){
      location.replace('/');
    });
</script>
<noscript><a href="/">トップページへ</a></noscript>
</body>
</html>
